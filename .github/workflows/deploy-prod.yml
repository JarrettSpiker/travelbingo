name: deploy-prod

# Deploys the prod frontend via a manual, review-gated run.
# The `prod` GitHub Environment should have required reviewers configured.
# Infrastructure for prod is applied separately by HCP Terraform (manual apply).
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  backend:
    name: Deploy prod backend
    uses: ./.github/workflows/_deploy-backend.yml
    with:
      environment: prod

  prod:
    name: Deploy prod
    # The frontend calls the API, so the API is updated first. A failed backend
    # deploy stops the frontend rather than half-deploying the environment.
    needs: backend
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: prod

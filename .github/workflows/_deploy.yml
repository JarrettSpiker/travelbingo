name: deploy

# Reusable workflow that builds the frontend and deploys it to one environment.
# Callers: deploy-dev.yml, deploy-prod.yml.
#
# Configuration is resolved from the GitHub Environment named by `environment`:
#   vars.AWS_ROLE_ARN              - OIDC role to assume (from bootstrap)
#   vars.S3_BUCKET                 - target S3 bucket
#   vars.CLOUDFRONT_DISTRIBUTION_ID - CloudFront distribution to invalidate
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment to deploy to (dev or prod).
        required: true
        type: string

permissions:
  id-token: write # required for OIDC
  contents: read

# NOTE: concurrency is declared in the caller workflows (deploy-dev/prod),
# not here. A reusable workflow sharing a concurrency group with its caller
# causes GitHub to detect a deadlock and cancel the run.

jobs:
  deploy:
    name: Deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload to S3
        run: aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"

name: deploy-dev

# Deploys the dev frontend on every push to main and dev (and manually).
# Infrastructure for dev is applied separately by HCP Terraform (auto-apply).
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  backend:
    name: Deploy dev backend
    uses: ./.github/workflows/_deploy-backend.yml
    with:
      environment: dev

  dev:
    name: Deploy dev
    # The frontend calls the API, so the API is updated first. A failed backend
    # deploy stops the frontend rather than half-deploying the environment.
    needs: backend
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev
